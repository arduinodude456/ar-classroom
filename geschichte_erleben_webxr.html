<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Geschichte erleben – WebXR AR</title>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:system-ui,sans-serif}
#startScreen{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;text-align:center;color:#fff;background:radial-gradient(circle at 50% 35%,#263c5c 0%,#111a29 35%,#05070b 80%)}
#startScreen h1{margin:0;font-size:clamp(34px,9vw,64px)}
.subtitle{margin-top:8px;font-size:19px;opacity:.75}
#startButton{margin-top:35px;padding:17px 32px;border:0;border-radius:18px;background:#fff;color:#111;font-size:18px;font-weight:750;cursor:pointer}
#startButton:active{transform:scale(.96)}
#status{margin-top:18px;max-width:500px;font-size:14px;line-height:1.5;opacity:.7}
#error{display:none;margin-top:15px;padding:12px 16px;max-width:500px;border-radius:12px;background:rgba(180,30,30,.25);color:#ffb5b5;font-size:14px}
#arUI{position:fixed;inset:0;z-index:20;pointer-events:none;display:none}
#title{position:absolute;top:18px;left:18px;padding:11px 17px;border-radius:16px;color:#fff;background:rgba(10,15,25,.78);backdrop-filter:blur(14px);font-weight:700;box-shadow:0 8px 30px rgba(0,0,0,.25)}
#hint{position:absolute;left:50%;bottom:25px;transform:translateX(-50%);width:min(90%,520px);padding:14px 20px;border-radius:17px;text-align:center;color:#fff;background:rgba(10,15,25,.78);backdrop-filter:blur(14px);box-shadow:0 8px 30px rgba(0,0,0,.25);font-size:15px}
#info{position:fixed;left:50%;bottom:25px;z-index:50;width:min(90%,600px);padding:24px;border-radius:24px;color:#fff;background:rgba(8,13,22,.94);backdrop-filter:blur(20px);box-shadow:0 20px 70px rgba(0,0,0,.55);transform:translate(-50%,150%);transition:transform .3s ease;pointer-events:auto}
#info.visible{transform:translate(-50%,0)}
#info h2{margin:0 45px 10px 0;font-size:25px}
#info p{margin:0;line-height:1.6;font-size:16px;opacity:.9}
#closeInfo{position:absolute;top:12px;right:12px;width:38px;height:38px;border:0;border-radius:50%;color:#fff;background:rgba(255,255,255,.12);font-size:23px;cursor:pointer}
</style>
</head>
<body>

<div id="startScreen">
  <div style="font-size:55px">🏛️</div>
  <h1>Geschichte erleben</h1>
  <div class="subtitle">Interaktive Zeitreise in Augmented Reality</div>
  <button id="startButton">AR starten</button>
  <div id="status">Prüfe WebXR-Unterstützung …</div>
  <div id="error"></div>
</div>

<div id="arUI">
  <div id="title">🏛️ Geschichte erleben</div>
  <div id="hint">Bewege dein Tablet über eine freie Fläche …</div>
</div>

<div id="info">
  <button id="closeInfo">×</button>
  <h2 id="infoTitle"></h2>
  <p id="infoText"></p>
</div>

<script type="module">
import * as THREE from "three";

const startScreen=document.getElementById("startScreen");
const startButton=document.getElementById("startButton");
const status=document.getElementById("status");
const errorBox=document.getElementById("error");
const arUI=document.getElementById("arUI");
const hint=document.getElementById("hint");
const info=document.getElementById("info");
const infoTitle=document.getElementById("infoTitle");
const infoText=document.getElementById("infoText");
const closeInfo=document.getElementById("closeInfo");

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.01,30);

const renderer=new THREE.WebGLRenderer({
  antialias:true,
  alpha:true,
  powerPreference:"high-performance"
});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.setClearColor(0x000000,0);
renderer.xr.enabled=true;
renderer.xr.setReferenceSpaceType("local");
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x444444,2.2));
const directional=new THREE.DirectionalLight(0xffffff,1.5);
directional.position.set(2,4,2);
scene.add(directional);

const reticle=new THREE.Mesh(
  new THREE.RingGeometry(.08,.105,32).rotateX(-Math.PI/2),
  new THREE.MeshBasicMaterial({color:0x00eaff,transparent:true,opacity:.95,side:THREE.DoubleSide})
);
reticle.matrixAutoUpdate=false;
reticle.visible=false;
scene.add(reticle);

let hitTestSource=null;
let hitTestSourceRequested=false;
let exhibition=null;

const stations=[
 {title:"Das Römische Reich",icon:"🏛",text:"Das Römische Reich entwickelte sich über viele Jahrhunderte zu einer der bedeutendsten politischen Mächte der Antike. Es kontrollierte zeitweise große Teile Europas, Nordafrikas und des Nahen Ostens."},
 {title:"Das Mittelalter",icon:"🏰",text:"Das Mittelalter wird traditionell ungefähr vom 5. bis zum späten 15. Jahrhundert eingeordnet. Burgen, Städte, Handel und das Lehnswesen prägten viele Regionen Europas."},
 {title:"Französische Revolution",icon:"⚔",text:"1789 begann die Französische Revolution. Politische und gesellschaftliche Umwälzungen veränderten Frankreich und beeinflussten die politische Entwicklung Europas."},
 {title:"Industrialisierung",icon:"⚙",text:"Die Industrialisierung veränderte Produktion, Arbeit und Städte grundlegend. Maschinen, Fabriken und neue Verkehrswege führten zu tiefgreifenden gesellschaftlichen Veränderungen."},
 {title:"Historische Quellen",icon:"📜",text:"Briefe, Urkunden, Bilder, Gegenstände und Zeitzeugenberichte sind wichtige Quellen für die Erforschung der Vergangenheit."}
];

function createStationTexture(data){
  const canvas=document.createElement("canvas");
  canvas.width=1024; canvas.height=700;
  const ctx=canvas.getContext("2d");

  ctx.fillStyle="rgba(8,15,25,.94)";
  ctx.beginPath(); ctx.roundRect(10,10,1004,680,45); ctx.fill();
  ctx.strokeStyle="#3fdcff"; ctx.lineWidth=8; ctx.stroke();

  ctx.fillStyle="white"; ctx.textAlign="center";
  ctx.font="100px sans-serif"; ctx.fillText(data.icon,512,120);
  ctx.font="bold 52px sans-serif"; ctx.fillText(data.title,512,205);

  ctx.textAlign="left"; ctx.font="32px sans-serif";
  const words=data.text.split(" ");
  let line="",y=285;
  for(const word of words){
    const test=line+word+" ";
    if(ctx.measureText(test).width>850){
      ctx.fillText(line,87,y); line=word+" "; y+=46;
    }else line=test;
  }
  if(line)ctx.fillText(line,87,y);

  ctx.globalAlpha=.55;
  ctx.textAlign="center"; ctx.font="bold 25px sans-serif";
  ctx.fillText("ANTIPPEN FÜR INFORMATIONEN",512,650);

  const texture=new THREE.CanvasTexture(canvas);
  texture.colorSpace=THREE.SRGBColorSpace;
  texture.anisotropy=renderer.capabilities.getMaxAnisotropy();
  return texture;
}

function createStation(data){
  const mesh=new THREE.Mesh(
    new THREE.PlaneGeometry(.9,.615),
    new THREE.MeshBasicMaterial({map:createStationTexture(data),transparent:true,side:THREE.DoubleSide})
  );
  mesh.userData={type:"station",title:data.title,text:data.text};
  return mesh;
}

function createExhibition(position){
  exhibition=new THREE.Group();
  exhibition.position.copy(position);

  const platform=new THREE.Mesh(
    new THREE.CylinderGeometry(.65,.65,.035,48),
    new THREE.MeshStandardMaterial({color:0x334455,metalness:.5,roughness:.35})
  );
  platform.position.y=.018;
  exhibition.add(platform);

  const ring=new THREE.Mesh(
    new THREE.RingGeometry(.62,.67,48),
    new THREE.MeshBasicMaterial({color:0x00d9ff,side:THREE.DoubleSide,transparent:true,opacity:.8})
  );
  ring.rotation.x=-Math.PI/2; ring.position.y=.04; exhibition.add(ring);

  const radius=1.35;
  stations.forEach((data,index)=>{
    const station=createStation(data);
    const angle=index/stations.length*Math.PI*2;
    station.position.set(Math.sin(angle)*radius,.85,Math.cos(angle)*radius);
    station.rotation.y=angle+Math.PI;
    exhibition.add(station);
  });

  const pillar=new THREE.Mesh(
    new THREE.CylinderGeometry(.12,.16,.8,24),
    new THREE.MeshStandardMaterial({color:0x8899aa,metalness:.7,roughness:.25})
  );
  pillar.position.y=.4; exhibition.add(pillar);

  scene.add(exhibition);
  hint.textContent="Tippe jetzt eine historische Station an.";
}

const controller=renderer.xr.getController(0);
scene.add(controller);

const raycaster=new THREE.Raycaster();

controller.addEventListener("select",()=>{
  // 1. Wahl: echte erkannte Fläche über Hit-Test.
  if(!exhibition && reticle.visible){
    const position=new THREE.Vector3();
    position.setFromMatrixPosition(reticle.matrix);
    createExhibition(position);
    return;
  }

  // 2. Wahl: Falls das Gerät zwar AR, aber keinen Hit-Test
  // für diese Session anbietet, wird die Ausstellung etwa
  // 1,5 m vor dem Tablet platziert.
  if(!exhibition){
    const position=new THREE.Vector3();
    const xrCamera=renderer.xr.getCamera(camera);
    const direction=new THREE.Vector3(0,0,-1);
    direction.applyQuaternion(xrCamera.quaternion).normalize();
    position.copy(xrCamera.position).addScaledVector(direction,1.5);

    // Etwas unter Augenhöhe platzieren.
    position.y-=0.45;

    createExhibition(position);
    hint.textContent="Ausstellung platziert – tippe eine Station an.";
    return;
  }

  if(!exhibition)return;

  const origin=new THREE.Vector3();
  const direction=new THREE.Vector3();
  const rotation=new THREE.Quaternion();
  const scale=new THREE.Vector3();

  controller.matrixWorld.decompose(origin,rotation,scale);
  direction.set(0,0,-1).applyQuaternion(rotation).normalize();
  raycaster.set(origin,direction);

  const objects=exhibition.children.filter(o=>o.userData?.type==="station");
  const hits=raycaster.intersectObjects(objects,true);

  if(hits.length){
    const station=hits[0].object;
    showInfo(station.userData.title,station.userData.text);
  }
});

function showInfo(title,text){
  infoTitle.textContent=title;
  infoText.textContent=text;
  info.classList.add("visible");
}

closeInfo.onclick=()=>info.classList.remove("visible");

function showError(message){
  errorBox.textContent="⚠️ "+message;
  errorBox.style.display="block";
  status.textContent="WebXR konnte nicht gestartet werden.";
}

async function startAR(){
  errorBox.style.display="none";

  if(!navigator.xr){
    showError("navigator.xr ist in diesem Browser nicht verfügbar.");
    return;
  }

  try{
    const supported=await navigator.xr.isSessionSupported("immersive-ar");
    if(!supported){
      showError("Dieser Browser unterstützt keine immersive AR-Sitzung.");
      return;
    }

    status.textContent="Starte AR …";

    // Für maximale Geräte-Kompatibilität werden hier KEINE
    // Features als "required" verlangt. Einige Android-WebXR-
    // Implementierungen melden immersive-ar als verfügbar,
    // lehnen aber eine Session mit requiredFeatures wie
    // "hit-test" trotzdem ab.
    const session=await navigator.xr.requestSession("immersive-ar",{
      requiredFeatures:[],
      optionalFeatures:["hit-test","local-floor","dom-overlay"],
      domOverlay:{root:document.body}
    });

    await renderer.xr.setSession(session);

    startScreen.style.display="none";
    arUI.style.display="block";
    hint.textContent="Bewege dein Tablet über eine freie Fläche …";

    session.addEventListener("end",()=>{
      hitTestSource=null;
      hitTestSourceRequested=false;
      reticle.visible=false;

      if(exhibition){
        scene.remove(exhibition);
        exhibition=null;
      }

      arUI.style.display="none";
      info.classList.remove("visible");
      startScreen.style.display="flex";
      status.textContent="AR wurde beendet.";
    });
  }catch(error){
    console.error(error);
    showError("AR konnte nicht gestartet werden: "+error.message);
  }
}

startButton.addEventListener("click",startAR);

(async()=>{
  if(!navigator.xr){
    status.textContent="⚠️ WebXR ist in diesem Browser nicht verfügbar.";
    return;
  }
  try{
    const supported=await navigator.xr.isSessionSupported("immersive-ar");
    status.textContent=supported
      ?"✅ Immersive AR wird unterstützt."
      :"⚠️ Immersive AR wird nicht unterstützt.";
  }catch{
    status.textContent="WebXR konnte nicht überprüft werden.";
  }
})();

renderer.setAnimationLoop((timestamp,frame)=>{
  if(frame){
    const session=renderer.xr.getSession();
    const referenceSpace=renderer.xr.getReferenceSpace();

    if(!hitTestSourceRequested){
      session.requestReferenceSpace("viewer").then(viewerSpace=>{
        session.requestHitTestSource({space:viewerSpace}).then(source=>{
          hitTestSource=source;
        });
      });
      hitTestSourceRequested=true;
    }

    if(hitTestSource){
      const results=frame.getHitTestResults(hitTestSource);
      if(results.length){
        const pose=results[0].getPose(referenceSpace);
        if(pose){
          reticle.visible=true;
          reticle.matrix.fromArray(pose.transform.matrix);
          if(!exhibition)hint.textContent="Fläche erkannt – tippe zum Platzieren.";
        }
      }else{
        reticle.visible=false;
        if(!exhibition)hint.textContent="Bewege dein Tablet über eine freie Fläche …";
      }
    }
  }

  if(exhibition){
    exhibition.children.forEach((object,index)=>{
      if(object.userData?.type==="station"){
        object.position.y=.85+Math.sin(timestamp*.001+index)*.025;
      }
    });
  }

  renderer.render(scene,camera);
});

window.addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
