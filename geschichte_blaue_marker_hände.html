<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Geschichte erleben – Blaue Marker + Hände</title>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:system-ui,sans-serif}
#video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
#scan{display:none}
#overlay{position:fixed;inset:0;pointer-events:none}
.marker{position:absolute;border:5px solid white;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 16px #08f,0 0 35px #08f;box-sizing:border-box;pointer-events:auto;cursor:pointer}
.marker.active{border-color:#7df9ff;box-shadow:0 0 20px #0ff,0 0 50px #0ff;transform:translate(-50%,-50%) scale(1.15)}
.markerLabel{position:absolute;left:50%;top:105%;transform:translateX(-50%);white-space:nowrap;background:#000c;color:#fff;padding:5px 9px;border-radius:9px;font-size:12px}
.fingertip{position:absolute;width:22px;height:22px;border:3px solid #fff;border-radius:50%;background:#0af;transform:translate(-50%,-50%);box-shadow:0 0 18px #0af;z-index:3}
.pointerLine{position:absolute;height:4px;background:#0af;transform-origin:0 50%;z-index:2;border-radius:4px;box-shadow:0 0 10px #0af}
.card{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:10;background:rgba(12,18,28,.97);color:#fff;padding:24px;border-radius:20px;width:min(360px,84vw);text-align:center;box-shadow:0 12px 45px #000b}
button{border:0;border-radius:12px;padding:13px 18px;font-size:16px;font-weight:700}
#start{background:#1677ee;color:#fff}
#hint,#status{position:fixed;left:12px;right:12px;z-index:5;background:#000c;color:#fff;padding:10px;border-radius:12px;text-align:center}
#hint{top:12px}#status{bottom:12px;font-size:13px}.hidden{display:none!important}
</style>
</head>
<body>
<video id="video" autoplay playsinline muted></video>
<canvas id="scan"></canvas>
<div id="overlay"></div>
<div id="startCard" class="card">
<h2>🔵 Geschichte erleben</h2>
<p>Die Kamera erkennt <b>mehrere blaue Kreise</b>. Wenn du mit dem Zeigefinger auf einen Kreis zeigst, wird er hervorgehoben.</p>
<button id="start">Kamera starten</button>
</div>
<div id="hint" class="hidden">Suche nach blauen Markern …</div>
<div id="status">Bereit</div>
<script>
const video=document.getElementById('video');
const canvas=document.getElementById('scan');
const ctx=canvas.getContext('2d',{willReadFrequently:true});
const overlay=document.getElementById('overlay');
const status=document.getElementById('status');
const hint=document.getElementById('hint');
const startCard=document.getElementById('startCard');
let stream=null,running=false,markers=[],handsReady=false,lastHandTime=0;

const stories=[
 {title:'🏛️ Antike',text:'Hier kann später dein Inhalt zur Antike erscheinen.'},
 {title:'🏰 Mittelalter',text:'Hier kann später dein Inhalt zum Mittelalter erscheinen.'},
 {title:'⚔️ Französische Revolution',text:'Hier kann später dein Inhalt zur Französischen Revolution erscheinen.'},
 {title:'🏭 Industrialisierung',text:'Hier kann später dein Inhalt zur Industrialisierung erscheinen.'},
 {title:'📜 Historische Quellen',text:'Hier können später Quellen und Aufgaben erscheinen.'}
];

let hands=null;
if(window.Hands){
 hands=new Hands({locateFile:file=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
 hands.setOptions({maxNumHands:2,modelComplexity:1,minDetectionConfidence:.5,minTrackingConfidence:.5});
 hands.onResults(onHands);
 handsReady=true;
}

document.getElementById('start').onclick=async()=>{try{
 if(!window.isSecureContext)throw new Error('HTTPS ist erforderlich.');
 if(!navigator.mediaDevices?.getUserMedia)throw new Error('Kamera-API nicht verfügbar.');
 stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});
 video.srcObject=stream;await video.play();
 startCard.classList.add('hidden');hint.classList.remove('hidden');running=true;
 status.textContent=handsReady?'Kamera aktiv – suche blaue Marker und Hände …':'Kamera aktiv – Handerkennung konnte nicht geladen werden.';
 requestAnimationFrame(scan);
}catch(e){status.textContent='Kamera-Fehler: '+(e.name||'')+' – '+(e.message||e)}};

function isBlue(r,g,b){
 const mx=Math.max(r,g,b),mn=Math.min(r,g,b),sat=mx?((mx-mn)/mx):0;
 return b>85 && b>r*1.15 && b>g*1.03 && (b-r)>25 && sat>.16;
}

function scan(){
 if(!running)return;
 if(video.readyState>=2&&video.videoWidth){
  const W=360,H=Math.max(200,Math.round(video.videoHeight*W/video.videoWidth));
  canvas.width=W;canvas.height=H;ctx.drawImage(video,0,0,W,H);
  const d=ctx.getImageData(0,0,W,H).data,mask=new Uint8Array(W*H),seen=new Uint8Array(W*H);
  let blueCount=0;
  for(let y=0;y<H;y+=2)for(let x=0;x<W;x+=2){const i=(y*W+x)*4;if(isBlue(d[i],d[i+1],d[i+2])){mask[y*W+x]=1;blueCount++;}}
  const qx=new Int32Array(W*H),qy=new Int32Array(W*H),found=[];
  for(let y=0;y<H;y+=2)for(let x=0;x<W;x+=2){const p=y*W+x;if(!mask[p]||seen[p])continue;
   let head=0,tail=0,minX=x,maxX=x,minY=y,maxY=y,count=0;qx[tail]=x;qy[tail++]=y;seen[p]=1;
   while(head<tail){const cx=qx[head],cy=qy[head++];count++;minX=Math.min(minX,cx);maxX=Math.max(maxX,cx);minY=Math.min(minY,cy);maxY=Math.max(maxY,cy);
    const ns=[[cx-2,cy],[cx+2,cy],[cx,cy-2],[cx,cy+2]];
    for(const [nx,ny] of ns)if(nx>=0&&nx<W&&ny>=0&&ny<H){const q=ny*W+nx;if(mask[q]&&!seen[q]){seen[q]=1;qx[tail]=nx;qy[tail++]=ny;}}
   }
   const bw=maxX-minX+2,bh=maxY-minY+2,area=bw*bh,fill=count*4/area,ratio=bw/bh;
   if(count>=28&&bw>=9&&bh>=9&&ratio>.45&&ratio<2.2&&fill>.12){
    const sx=(minX+maxX)/2/W*video.videoWidth,sy=(minY+maxY)/2/H*video.videoHeight;
    const pos=videoToScreen(sx,sy);const size=Math.max(50,Math.min(190,Math.max(bw/W*innerWidth,bh/H*innerHeight)));
    found.push({x:pos.x,y:pos.y,size,count});
   }
  }
  found.sort((a,b)=>b.count-a.count);
  markers=found.slice(0,8);
  renderMarkers();
  status.textContent='🔵 '+markers.length+' Marker erkannt · blaue Pixel: '+blueCount+(handsReady?' · Hände werden gesucht':'');
 }
 requestAnimationFrame(scan);
}

function videoToScreen(vx,vy){
 const vw=video.videoWidth,vh=video.videoHeight,sw=innerWidth,sh=innerHeight;
 const scale=Math.max(sw/vw,sh/vh),dw=vw*scale,dh=vh*scale,ox=(sw-dw)/2,oy=(sh-dh)/2;
 // Das Video wird gespiegelt, deshalb X umdrehen.
 return{x:sw-(vx*scale+ox),y:vy*scale+oy};
}

function renderMarkers(){
 overlay.querySelectorAll('.marker').forEach(e=>e.remove());
 markers.forEach((m,i)=>{
  const el=document.createElement('div');el.className='marker';el.dataset.index=i;
  el.style.left=m.x+'px';el.style.top=m.y+'px';el.style.width=m.size+'px';el.style.height=m.size+'px';
  const label=document.createElement('div');label.className='markerLabel';label.textContent='Marker '+(i+1);el.appendChild(label);
  el.onclick=()=>openStory(i);overlay.appendChild(el);
 });
}

function openStory(i){
 const s=stories[i%stories.length];
 const c=document.createElement('div');c.className='card';
 c.innerHTML=`<h2>${s.title}</h2><p>${s.text}</p><button>Schließen</button>`;
 c.querySelector('button').onclick=()=>c.remove();document.body.appendChild(c);
}

function onHands(results){
 if(!running)return;
 overlay.querySelectorAll('.fingertip,.pointerLine').forEach(e=>e.remove());
 let pointed=[];
 if(results.multiHandLandmarks){
  results.multiHandLandmarks.forEach((lm)=>{
   const tip=toScreenLandmark(lm[8]),mcp=toScreenLandmark(lm[5]),pip=toScreenLandmark(lm[6]);
   const fingerLen=dist(tip,mcp),pipLen=dist(pip,mcp);
   // Indexfinger grob ausgestreckt.
   if(fingerLen < pipLen*1.03) return;
   const dx=tip.x-mcp.x,dy=tip.y-mcp.y,den=dx*dx+dy*dy;if(!den)return;
   let html='';
   const dot=document.createElement('div');dot.className='fingertip';dot.style.left=tip.x+'px';dot.style.top=tip.y+'px';overlay.appendChild(dot);
   markers.forEach((m,i)=>{
    const vx=m.x-tip.x,vy=m.y-tip.y;
    const t=(vx*dx+vy*dy)/den;
    const px=tip.x+dx*t,py=tip.y+dy*t;
    const perpendicular=Math.hypot(m.x-px,m.y-py);
    const ahead=t>0;
    const close=perpendicular<Math.max(38,m.size*.72);
    const distance=Math.hypot(vx,vy);
    if(ahead&&close&&distance>10&&distance<Math.max(650,m.size*8)) pointed.push(i);
   });
  });
 }
 const unique=[...new Set(pointed)];
 document.querySelectorAll('.marker').forEach(el=>el.classList.toggle('active',unique.includes(Number(el.dataset.index))));
 if(unique.length){
  hint.textContent='☝️ Du zeigst auf Marker '+unique.map(i=>i+1).join(', ')+'. Tippe ihn an oder halte darauf.';
  status.textContent='☝️ Hand erkannt – Marker '+unique.map(i=>i+1).join(', ')+' wird anvisiert';
 }
}

function toScreenLandmark(p){return videoToScreen(p.x*video.videoWidth,p.y*video.videoHeight)}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}

// MediaPipe möglichst häufig, aber nicht in jedem Animationsframe aufrufen.
setInterval(async()=>{
 if(running&&handsReady&&video.readyState>=2&&!video.paused){
  try{await hands.send({image:video});}catch(e){status.textContent='Handerkennung: '+e.message;}
 }
},90);

addEventListener('resize',renderMarkers);
addEventListener('beforeunload',()=>stream?.getTracks().forEach(t=>t.stop()));
</script>
</body>
</html>
