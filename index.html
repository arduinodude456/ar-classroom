<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>AR Geschichte</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: system-ui, sans-serif;
    background: #000;
}

#camera {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 0;
    background: #111;
}

/* Verdunkelung für bessere Lesbarkeit */
#overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.12);
    z-index: 1;
    pointer-events: none;
}

/* Titel */
#title {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 20;

    padding: 12px 22px;
    border-radius: 18px;

    background: rgba(20,20,25,0.75);
    backdrop-filter: blur(12px);

    color: white;
    font-size: 20px;
    font-weight: 700;

    box-shadow: 0 5px 25px rgba(0,0,0,.25);
}

/*
    Die AR-Bühne.

    perspective sorgt dafür, dass die Buttons
    wie Objekte in einem 3D-Raum wirken.
*/
#scene {
    position: fixed;
    inset: 0;
    z-index: 5;

    perspective: 900px;
    transform-style: preserve-3d;
}

/* Gemeinsames Button-Design */
.ar-button {
    position: absolute;

    width: 150px;
    min-height: 65px;

    border: 0;
    border-radius: 18px;

    color: white;
    background: rgba(30, 30, 40, .88);

    border: 1px solid rgba(255,255,255,.25);

    backdrop-filter: blur(10px);

    font-size: 16px;
    font-weight: 700;

    cursor: pointer;

    box-shadow:
        0 12px 30px rgba(0,0,0,.35),
        inset 0 0 20px rgba(255,255,255,.04);

    transform-style: preserve-3d;

    transition:
        transform .25s ease,
        box-shadow .25s ease,
        background .25s ease;
}

.ar-button:hover {
    transform: scale(1.08) translateZ(30px);
}

.ar-button:active {
    transform: scale(.95);
}

/* Unterschiedliche räumliche Positionen */

#btn1 {
    left: 12%;
    top: 28%;
    transform: translateZ(-120px) rotateY(8deg);
}

#btn2 {
    left: 65%;
    top: 25%;
    transform: translateZ(-20px) rotateY(-10deg);
}

#btn3 {
    left: 38%;
    top: 50%;
    transform: translateZ(120px);
}

#btn4 {
    left: 72%;
    top: 67%;
    transform: translateZ(-80px) rotateY(-8deg);
}

#btn5 {
    left: 10%;
    top: 70%;
    transform: translateZ(60px) rotateY(8deg);
}


/* Informationsfenster */

#info {
    position: fixed;
    left: 50%;
    bottom: 25px;

    width: min(90%, 550px);

    transform: translate(-50%, 120%);

    z-index: 30;

    padding: 24px;

    border-radius: 24px;

    background: rgba(15,15,20,.88);
    backdrop-filter: blur(18px);

    color: white;

    box-shadow: 0 20px 60px rgba(0,0,0,.45);

    transition: transform .35s ease;
}

#info.visible {
    transform: translate(-50%, 0);
}

#info h2 {
    margin: 0 0 10px;
    font-size: 23px;
}

#info p {
    margin: 0;
    line-height: 1.55;
    opacity: .9;
}

#close {
    position: absolute;
    right: 14px;
    top: 12px;

    width: 35px;
    height: 35px;

    border: 0;
    border-radius: 50%;

    background: rgba(255,255,255,.12);
    color: white;

    font-size: 20px;
}


/* Startbildschirm */

#start {
    position: fixed;
    inset: 0;

    z-index: 100;

    display: flex;
    flex-direction: column;

    align-items: center;
    justify-content: center;

    padding: 30px;

    text-align: center;

    color: white;

    background:
        radial-gradient(circle at center,
            rgba(70,80,120,.7),
            rgba(5,5,10,.96));
}

#start h1 {
    font-size: clamp(30px, 8vw, 55px);
    margin-bottom: 10px;
}

#start p {
    max-width: 550px;
    line-height: 1.5;
    opacity: .85;
}

#startButton {
    margin-top: 25px;

    border: 0;
    border-radius: 18px;

    padding: 16px 28px;

    background: white;
    color: #111;

    font-size: 18px;
    font-weight: 700;

    cursor: pointer;
}

#status {
    margin-top: 15px;
    font-size: 13px;
    opacity: .65;
}
</style>
</head>

<body>

<!-- Kamerabild -->
<video id="camera" autoplay playsinline muted></video>

<div id="overlay"></div>

<div id="title">
    🏛️ Geschichte erleben
</div>


<!-- AR-Szene -->

<div id="scene">

    <button
        class="ar-button"
        id="btn1"
        data-title="Das Römische Reich"
        data-text="Das Römische Reich entwickelte sich über viele Jahrhunderte zu einem der bedeutendsten Reiche der Antike. Rom kontrollierte zeitweise große Teile Europas, Nordafrikas und des Nahen Ostens.">
        🏛️<br>
        Römisches Reich
    </button>


    <button
        class="ar-button"
        id="btn2"
        data-title="Das Mittelalter"
        data-text="Das Mittelalter wird traditionell ungefähr vom 5. bis zum späten 15. Jahrhundert eingeordnet. Städte, Burgen, Handel und das Lehnswesen prägten viele Regionen Europas.">
        🏰<br>
        Mittelalter
    </button>


    <button
        class="ar-button"
        id="btn3"
        data-title="Französische Revolution"
        data-text="1789 begann die Französische Revolution. Politische und gesellschaftliche Umwälzungen veränderten Frankreich und beeinflussten die politische Entwicklung Europas nachhaltig.">
        ⚔️<br>
        Revolution
    </button>


    <button
        class="ar-button"
        id="btn4"
        data-title="Industrialisierung"
        data-text="Die Industrialisierung veränderte Produktion, Arbeit und Städte grundlegend. Maschinen, Fabriken und neue Verkehrswege führten zu tiefgreifenden gesellschaftlichen Veränderungen.">
        ⚙️<br>
        Industrialisierung
    </button>


    <button
        class="ar-button"
        id="btn5"
        data-title="Historische Quellen"
        data-text="Historische Quellen sind wichtige Grundlagen der Geschichtswissenschaft. Dazu gehören beispielsweise Briefe, Urkunden, Bilder, Gegenstände und Zeitzeugenberichte.">
        📜<br>
        Quellen
    </button>

</div>


<!-- Informationsfenster -->

<div id="info">

    <button id="close">×</button>

    <h2 id="infoTitle"></h2>

    <p id="infoText"></p>

</div>


<!-- Start -->

<div id="start">

    <h1>Geschichte im Raum</h1>

    <p>
        Richte deine Kamera auf den Raum.
        Anschließend kannst du die historischen
        Stationen anklicken.
    </p>

    <button id="startButton">
        Kamera starten
    </button>

    <div id="status">
        Kamera wird erst nach deiner Zustimmung aktiviert.
    </div>

</div>


<script>

/* =========================================================
   KAMERA
   ========================================================= */

const camera = document.getElementById("camera");
const startScreen = document.getElementById("start");
const startButton = document.getElementById("startButton");
const status = document.getElementById("status");


async function startCamera() {

    try {

        const stream =
            await navigator.mediaDevices.getUserMedia({
                video: {
                    facingMode: {
                        ideal: "environment"
                    }
                },
                audio: false
            });

        camera.srcObject = stream;

        startScreen.style.display = "none";

    } catch (error) {

        console.error(error);

        status.textContent =
            "Kamera konnte nicht gestartet werden.";

        /*
            Die Präsentation kann trotzdem benutzt werden.
            Wir lassen die Oberfläche sichtbar.
        */

        setTimeout(() => {
            startScreen.style.display = "none";
        }, 2000);
    }
}


startButton.addEventListener("click", startCamera);


/* =========================================================
   INFORMATIONEN
   ========================================================= */

const buttons =
    document.querySelectorAll(".ar-button");

const info =
    document.getElementById("info");

const infoTitle =
    document.getElementById("infoTitle");

const infoText =
    document.getElementById("infoText");

const closeButton =
    document.getElementById("close");


buttons.forEach(button => {

    button.addEventListener("click", () => {

        const title =
            button.dataset.title;

        const text =
            button.dataset.text;

        infoTitle.textContent = title;
        infoText.textContent = text;

        info.classList.add("visible");

    });

});


closeButton.addEventListener("click", () => {

    info.classList.remove("visible");

});


/* =========================================================
   LEICHTE "SCHWEBE"-ANIMATION
   ========================================================= */

let time = 0;

function animate() {

    time += 0.01;

    buttons.forEach((button, index) => {

        const base =
            index % 2 === 0 ? 0 : Math.PI;

        const y =
            Math.sin(time * 1.4 + base) * 5;

        button.style.marginTop = y + "px";

    });

    requestAnimationFrame(animate);
}

animate();


/* =========================================================
   KAMERA-STATUS
   ========================================================= */

if (!navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia) {

    status.textContent =
        "Dieser Browser unterstützt keinen Kamerazugriff.";

}

</script>

</body>
</html>
