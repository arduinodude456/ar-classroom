<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Geschichte erleben – Blaue Marker</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: system-ui, sans-serif;
}

#video {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
}

#scan {
    display: none;
}

#overlay {
    position: fixed;
    inset: 0;
    pointer-events: none;
}

.marker {
    position: absolute;
    border: 5px solid white;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    box-shadow:
        0 0 18px #0088ff,
        0 0 35px #0088ff;
    pointer-events: auto;
    box-sizing: border-box;
}

.card {
    position: fixed;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    z-index: 5;

    background: rgba(16, 21, 31, 0.95);
    color: white;

    padding: 24px;
    border-radius: 20px;

    width: min(330px, 80vw);
    text-align: center;

    box-shadow: 0 12px 45px rgba(0,0,0,.7);
}

button {
    border: 0;
    border-radius: 12px;
    padding: 13px 18px;

    font-size: 16px;
    font-weight: 700;
}

#start {
    background: #1677ee;
    color: white;
}

#hint,
#status {
    position: fixed;
    left: 12px;
    right: 12px;

    z-index: 4;

    background: rgba(0,0,0,.72);
    color: white;

    padding: 11px;
    border-radius: 12px;

    text-align: center;
}

#hint {
    top: 12px;
}

#status {
    bottom: 12px;
    font-size: 14px;
}

.hidden {
    display: none !important;
}
</style>
</head>

<body>

<video
    id="video"
    autoplay
    playsinline
    muted>
</video>

<canvas id="scan"></canvas>

<div id="overlay"></div>


<div id="startCard" class="card">

    <h2>🔵 Blaue Marker</h2>

    <p>
        Richte die Kamera auf einen blauen Kreis.
        Wird er erkannt, kannst du ihn antippen.
    </p>

    <button id="start">
        Kamera starten
    </button>

</div>


<div id="hint" class="hidden">
    Suche nach blauen Kreisen …
</div>

<div id="status">
    Bereit
</div>


<script>

const video =
    document.getElementById("video");

const canvas =
    document.getElementById("scan");

const ctx =
    canvas.getContext(
        "2d",
        { willReadFrequently: true }
    );

const overlay =
    document.getElementById("overlay");

const status =
    document.getElementById("status");

const hint =
    document.getElementById("hint");

const startCard =
    document.getElementById("startCard");


let stream = null;
let running = false;
let found = false;


/*
    KAMERA STARTEN
*/

document
    .getElementById("start")
    .onclick = async () => {

    try {

        if (!window.isSecureContext) {

            throw new Error(
                "Bitte die Datei über HTTPS öffnen."
            );

        }

        stream =
            await navigator
                .mediaDevices
                .getUserMedia({

                    video: {
                        facingMode: {
                            ideal: "environment"
                        }
                    },

                    audio: false

                });


        video.srcObject = stream;

        await video.play();


        startCard
            .classList
            .add("hidden");

        hint
            .classList
            .remove("hidden");


        running = true;


        status.textContent =
            "Kamera aktiv – suche blaue Kreise …";


        requestAnimationFrame(scan);


    } catch (e) {

        status.textContent =
            "Kamera-Fehler: " +
            (e.name || "") +
            " – " +
            (e.message || e);

    }

};


/*
    BLAUE MARKER SUCHEN
*/

function scan() {

    if (!running)
        return;


    if (
        video.readyState >= 2 &&
        video.videoWidth
    ) {

        /*
            Kleines Analysebild erzeugen.
            Dadurch muss nicht jedes Kamerapixel
            verarbeitet werden.
        */

        const w = 320;

        const h = Math.max(
            180,
            Math.round(
                video.videoHeight *
                w /
                video.videoWidth
            )
        );


        canvas.width = w;
        canvas.height = h;


        ctx.drawImage(
            video,
            0,
            0,
            w,
            h
        );


        const data =
            ctx.getImageData(
                0,
                0,
                w,
                h
            ).data;


        let minX = w;
        let minY = h;

        let maxX = -1;
        let maxY = -1;

        let count = 0;


        /*
            Blaue Pixel suchen
        */

        for (
            let y = 0;
            y < h;
            y += 3
        ) {

            for (
                let x = 0;
                x < w;
                x += 3
            ) {

                const i =
                    (y * w + x) * 4;


                const r = data[i];
                const g = data[i + 1];
                const b = data[i + 2];


                /*
                    Blau-Erkennung

                    Die Werte sind absichtlich
                    relativ tolerant.
                */

                if (
                    b > 115 &&
                    b > r * 1.35 &&
                    b > g * 1.12 &&
                    b - r > 40
                ) {

                    minX =
                        Math.min(
                            minX,
                            x
                        );

                    maxX =
                        Math.max(
                            maxX,
                            x
                        );

                    minY =
                        Math.min(
                            minY,
                            y
                        );

                    maxY =
                        Math.max(
                            maxY,
                            y
                        );

                    count++;

                }

            }

        }


        const bw =
            maxX - minX;

        const bh =
            maxY - minY;

        const area =
            bw * bh;


        const ratio =
            bh > 0
                ? bw / bh
                : 0;


        /*
            Prüfen, ob die blaue Fläche
            ungefähr kreisförmig/quadratisch
            und groß genug ist.
        */

        if (
            count > 70 &&
            area > 3000 &&
            ratio > 0.55 &&
            ratio < 1.8
        ) {

            const x =
                ((minX + maxX) / 2) /
                w *
                innerWidth;


            const y =
                ((minY + maxY) / 2) /
                h *
                innerHeight;


            const size =
                Math.max(
                    55,
                    Math.min(
                        150,
                        Math.max(
                            bw / w * innerWidth,
                            bh / h * innerHeight
                        )
                    )
                );


            showMarker(
                x,
                y,
                size
            );


            found = true;


            status.textContent =
                "🔵 Blauer Marker erkannt";

            hint.textContent =
                "Marker erkannt – antippen";


        } else {

            removeMarker();


            if (found) {

                status.textContent =
                    "Suche nach blauen Kreisen …";

            }


            found = false;


            hint.textContent =
                "Suche nach blauen Kreisen …";

        }

    }


    requestAnimationFrame(scan);

}


/*
    ERKANNTEN MARKER ANZEIGEN
*/

function showMarker(
    x,
    y,
    size
) {

    removeMarker();


    const marker =
        document.createElement("div");


    marker.className =
        "marker";


    marker.style.left =
        x + "px";

    marker.style.top =
        y + "px";


    marker.style.width =
        size + "px";

    marker.style.height =
        size + "px";


    /*
        Wenn der Marker angetippt wird
    */

    marker.onclick = () => {

        const card =
            document.createElement("div");


        card.className =
            "card";


        card.innerHTML = `

            <h2>
                🏛️ Historischer Punkt
            </h2>

            <p>
                Das ist ein erkannter
                blauer Marker.
            </p>

            <p>
                Hier können später
                historische Informationen,
                Bilder, Quellen und
                Aufgaben erscheinen.
            </p>

            <button>
                Schließen
            </button>

        `;


        card
            .querySelector("button")
            .onclick = () => {

                card.remove();

            };


        document.body
            .appendChild(card);

    };


    overlay
        .appendChild(marker);

}


/*
    MARKER ENTFERNEN
*/

function removeMarker() {

    overlay
        .querySelectorAll(".marker")
        .forEach(
            element => element.remove()
        );

}


/*
    KAMERA BEIM VERLASSEN DER SEITE
    STOPPEN
*/

window.addEventListener(
    "beforeunload",
    () => {

        if (stream) {

            stream
                .getTracks()
                .forEach(
                    track => track.stop()
                );

        }

    }
);

</script>

</body>
</html>
