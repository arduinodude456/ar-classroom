<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Geschichte erleben – Blaue Marker + Hände v10</title>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:system-ui,sans-serif}
#video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover}
#scan{display:none}
#overlay{position:fixed;inset:0;pointer-events:none}
.marker{position:absolute;border:5px solid white;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 16px #08f,0 0 35px #08f;box-sizing:border-box;pointer-events:auto;cursor:pointer}
.marker.active{border-color:#7df9ff;box-shadow:0 0 20px #0ff,0 0 50px #0ff;transform:translate(-50%,-50%) scale(1.15)}
.markerLabel{position:absolute;left:50%;top:105%;transform:translateX(-50%);white-space:nowrap;background:#000c;color:#fff;padding:5px 9px;border-radius:9px;font-size:12px}
.fingertip{position:absolute;width:22px;height:22px;border:3px solid #fff;border-radius:50%;background:#0af;transform:translate(-50%,-50%);box-shadow:0 0 18px #0af;z-index:3}
.holdRing{position:absolute;border:4px solid #19a7ff;border-radius:50%;transform:translate(-50%,-50%);z-index:4;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;text-shadow:0 1px 3px #000;background:conic-gradient(#19a7ff calc(var(--p)*360deg),#ffffff33 0);background-origin:border-box;box-shadow:0 0 20px #19a7ff;font-size:15px}.holdRing::before{content:"";position:absolute;inset:4px;border-radius:50%;background:#0007}.holdRing{isolation:isolate}.holdRing{color:#fff}.pointerLine{position:absolute;height:4px;background:#0af;transform-origin:0 50%;z-index:2;border-radius:4px;box-shadow:0 0 10px #0af}
.card{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:10;background:rgba(12,18,28,.97);color:#fff;padding:24px;border-radius:20px;width:min(360px,84vw);text-align:center;box-shadow:0 12px 45px #000b}
button{border:0;border-radius:12px;padding:13px 18px;font-size:16px;font-weight:700}
#start{background:#1677ee;color:#fff}
#hint,#status{position:fixed;left:12px;right:12px;z-index:5;background:#000c;color:#fff;padding:10px;border-radius:12px;text-align:center}
#hint{top:12px}#status{bottom:12px;font-size:13px}.hidden
#videoCard{width:min(720px,92vw);padding:14px;z-index:20}
#historyVideo{display:block;width:100%;max-height:65vh;border-radius:14px;background:#000}
#videoTitle{margin:4px 0 10px;font-size:20px}
#videoProgress{height:8px;background:#333;border-radius:99px;overflow:hidden;margin:10px 0 4px}
#videoProgress>div{height:100%;width:0;background:#19a7ff;transition:width .08s linear}
#videoClose{margin-top:10px;width:100%}{display:none!important}
</style>
</head>
<body>
<video id="video" autoplay playsinline muted></video>
<canvas id="scan"></canvas>
<div id="overlay"></div>
<div id="startCard" class="card">
<h2>🔵 Geschichte erleben</h2>
<p>Die Kamera erkennt <b>mehrere blaue Kreise</b> und mehrere Hände gleichzeitig. Halte einen Zeigefinger etwa <b>3 Sekunden</b> auf einen Marker – dann startet sein Video.</p>
<button id="start">Kamera starten</button>
</div>
<div id="hint" class="hidden">Suche nach blauen Markern …</div>
<div id="videoCard" class="card hidden"></div>
<div id="status">Bereit</div>
<script>
const video=document.getElementById('video');
const canvas=document.getElementById('scan');
const ctx=canvas.getContext('2d',{willReadFrequently:true});
const overlay=document.getElementById('overlay');
const status=document.getElementById('status');
const hint=document.getElementById('hint');
const startCard=document.getElementById('startCard');
let stream=null,running=false,markers=[],handsReady=false,lastHandTime=0,handsBusy=false;
let markerIdCounter=0, previousMarkers=[], holdStates=new Map(), activeVideoMarker=null;

const stories=[
 {title:'🏛️ Antike',text:'Beispielvideo zur Antike.'},
 {title:'🏰 Mittelalter',text:'Beispielvideo zum Mittelalter.'},
 {title:'⚔️ Französische Revolution',text:'Beispielvideo zur Französischen Revolution.'},
 {title:'🏭 Industrialisierung',text:'Beispielvideo zur Industrialisierung.'},
 {title:'📜 Historische Quellen',text:'Beispielvideo zu historischen Quellen.'},
 {title:'🌍 Geschichte',text:'Beispielvideo zur Geschichte.'}
];
// Später hier deine eigenen Videos eintragen. Bis dahin läuft ein öffentliches Testvideo.
const videoUrls=stories.map(()=> 'https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4');

let hands=null;
if(window.Hands){
 hands=new Hands({locateFile:file=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
 hands.setOptions({maxNumHands:6,modelComplexity:1,minDetectionConfidence:.30,minTrackingConfidence:.30});
 hands.onResults(onHands);
 handsReady=true;
}

document.getElementById('start').onclick=async()=>{try{
 if(!window.isSecureContext)throw new Error('HTTPS ist erforderlich.');
 if(!navigator.mediaDevices?.getUserMedia)throw new Error('Kamera-API nicht verfügbar.');
 stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:2560,min:1280},height:{ideal:1440,min:720}},audio:false});
 video.srcObject=stream;await video.play();
 startCard.classList.add('hidden');hint.classList.remove('hidden');running=true;
 const settings=stream.getVideoTracks()[0]?.getSettings?.()||{};
 status.textContent=handsReady?`Kamera aktiv – ${settings.width||'?'}×${settings.height||'?'} · bis zu 6 Hände · Marker werden gesucht …`:'Kamera aktiv – Handerkennung konnte nicht geladen werden.';
 requestAnimationFrame(scan);
}catch(e){status.textContent='Kamera-Fehler: '+(e.name||'')+' – '+(e.message||e)}};

function isBlue(r,g,b){
 const mx=Math.max(r,g,b),mn=Math.min(r,g,b),sat=mx?((mx-mn)/mx):0;
 return b>85 && b>r*1.15 && b>g*1.03 && (b-r)>25 && sat>.16;
}

function scan(){
 if(!running)return;
 if(video.readyState>=2&&video.videoWidth){
  const W=640,H=Math.max(360,Math.round(video.videoHeight*W/video.videoWidth));
  canvas.width=W;canvas.height=H;ctx.drawImage(video,0,0,W,H);
  const d=ctx.getImageData(0,0,W,H).data,mask=new Uint8Array(W*H),seen=new Uint8Array(W*H);
  let blueCount=0;
  for(let y=0;y<H;y+=2)for(let x=0;x<W;x+=2){const i=(y*W+x)*4;if(isBlue(d[i],d[i+1],d[i+2])){mask[y*W+x]=1;blueCount++;}}
  const qx=new Int32Array(W*H),qy=new Int32Array(W*H),found=[];
  for(let y=0;y<H;y+=2)for(let x=0;x<W;x+=2){const p=y*W+x;if(!mask[p]||seen[p])continue;
   let head=0,tail=0,minX=x,maxX=x,minY=y,maxY=y,count=0;qx[tail]=x;qy[tail++]=y;seen[p]=1;
   while(head<tail){const cx=qx[head],cy=qy[head++];count++;minX=Math.min(minX,cx);maxX=Math.max(maxX,cx);minY=Math.min(minY,cy);maxY=Math.max(maxY,cy);
    const ns=[[cx-2,cy],[cx+2,cy],[cx,cy-2],[cx,cy+2]];
    for(const [nx,ny] of ns)if(nx>=0&&nx<W&&ny>=0&&ny<H){const q=ny*W+nx;if(mask[q]&&!seen[q]){seen[q]=1;qx[tail]=nx;qy[tail++]=ny;}}
   }
   const bw=maxX-minX+2,bh=maxY-minY+2,area=bw*bh,fill=count*4/area,ratio=bw/bh;
   if(count>=28&&bw>=9&&bh>=9&&ratio>.45&&ratio<2.2&&fill>.12){
    const sx=(minX+maxX)/2/W*video.videoWidth,sy=(minY+maxY)/2/H*video.videoHeight;
    const pos=videoToScreen(sx,sy);const size=Math.max(50,Math.min(190,Math.max(bw/W*innerWidth,bh/H*innerHeight)));
    found.push({x:pos.x,y:pos.y,size,count});
   }
  }
  found.sort((a,b)=>b.count-a.count);
  const next=[];
  for(const f of found.slice(0,8)){
   let best=null,bestD=Infinity;
   for(const old of previousMarkers){const d=Math.hypot(f.x-old.x,f.y-old.y);if(d<bestD&&d<Math.max(130,f.size*1.1)){best=old;bestD=d;}}
   if(best){f.id=best.id;}
   else f.id=++markerIdCounter;
   next.push(f);
  }
  previousMarkers=next.map(m=>({...m}));
  markers=next;
  renderMarkers();
  status.textContent='🔵 '+markers.length+' Marker erkannt · blaue Pixel: '+blueCount+(handsReady?' · Hände werden gesucht':'');
 }
 requestAnimationFrame(scan);
}

function videoToScreen(vx,vy){
 const vw=video.videoWidth,vh=video.videoHeight;
 const vr=video.getBoundingClientRect();
 const sw=vr.width,sh=vr.height;
 const scale=Math.max(sw/vw,sh/vh);
 const dw=vw*scale,dh=vh*scale;
 const ox=(sw-dw)/2,oy=(sh-dh)/2;
 return{x:vr.left+vx*scale+ox,y:vr.top+vy*scale+oy};
}

function renderMarkers(){
 overlay.querySelectorAll('.marker').forEach(e=>e.remove());
 markers.forEach((m,i)=>{
  const el=document.createElement('div');el.className='marker';el.dataset.index=i;
  el.style.left=m.x+'px';el.style.top=m.y+'px';el.style.width=m.size+'px';el.style.height=m.size+'px';
  const label=document.createElement('div');label.className='markerLabel';label.textContent='Marker '+(i+1);el.appendChild(label);
  el.onclick=()=>openVideo(i);overlay.appendChild(el);
 });
}

function openVideo(i){
 if(activeVideoMarker!==null)return;
 activeVideoMarker=i;
 const s=stories[i%stories.length];
 const box=document.getElementById('videoCard');
 box.innerHTML=`<h2 id="videoTitle">${s.title}</h2><p>${s.text}</p><video id="historyVideo" controls autoplay playsinline src="${videoUrls[i%videoUrls.length]}"></video><button id="videoClose">Schließen</button>`;
 box.classList.remove('hidden');
 document.getElementById('videoClose').onclick=closeVideo;
}
function closeVideo(){
 const v=document.getElementById('historyVideo'); if(v)v.pause();
 document.getElementById('videoCard').classList.add('hidden');
 activeVideoMarker=null;
 holdStates.clear();
}
function updateHoldStates(pointed){
 const now=performance.now();
 const set=new Set(pointed);
 markers.forEach((m,i)=>{
  const state=holdStates.get(m.id)||{since:0,opened:false};
  if(set.has(i)){
   if(!state.since)state.since=now;
   const elapsed=now-state.since;
   if(!state.opened && elapsed>=3000 && activeVideoMarker===null){
    state.opened=true; holdStates.set(m.id,state); openVideo(i); return;
   }
  }else{
   state.since=0; state.opened=false;
  }
  holdStates.set(m.id,state);
 });
 // Alte Markerzustände entfernen
 const ids=new Set(markers.map(m=>m.id));
 for(const id of holdStates.keys())if(!ids.has(id))holdStates.delete(id);
}

function onHands(results){
 if(!running)return;
 const handCount=(results.multiHandLandmarks||[]).length;
 overlay.querySelectorAll('.fingertip,.pointerLine,.holdRing').forEach(e=>e.remove());
 let pointed=[];
 if(results.multiHandLandmarks){
  results.multiHandLandmarks.forEach((lm,handIndex)=>{
   const tip=toScreenLandmark(lm[8]),mcp=toScreenLandmark(lm[5]);
   const dx=tip.x-mcp.x,dy=tip.y-mcp.y,den=dx*dx+dy*dy;
   const dot=document.createElement('div');dot.className='fingertip';dot.style.left=tip.x+'px';dot.style.top=tip.y+'px';dot.title='Hand '+(handIndex+1);overlay.appendChild(dot);
   if(!den)return;
   markers.forEach((m,i)=>{
    const vx=m.x-tip.x,vy=m.y-tip.y;
    const t=(vx*dx+vy*dy)/den;
    const px=tip.x+dx*t,py=tip.y+dy*t;
    const perpendicular=Math.hypot(m.x-px,m.y-py);
    const ahead=t>0;
    const close=perpendicular<Math.max(45,m.size*.75);
    const distance=Math.hypot(vx,vy);
    if(ahead&&close&&distance>10&&distance<Math.max(700,m.size*8)) pointed.push(i);
   });
  });
 }
 const unique=[...new Set(pointed)];
 document.querySelectorAll('.marker').forEach(el=>el.classList.toggle('active',unique.includes(Number(el.dataset.index))));
 updateHoldStates(unique);
 // Haltefortschritt visualisieren
 markers.forEach((m,i)=>{
  const st=holdStates.get(m.id); if(!st||!st.since||!unique.includes(i))return;
  const progress=Math.min(1,(performance.now()-st.since)/3000);
  const ring=document.createElement('div'); ring.className='holdRing';
  ring.style.left=m.x+'px';ring.style.top=m.y+'px';ring.style.width=(m.size+18)+'px';ring.style.height=(m.size+18)+'px';
  ring.style.setProperty('--p',progress);
  ring.textContent=Math.ceil(3-progress*3)+'s';
  overlay.appendChild(ring);
 });
 if(handCount){
  hint.textContent=unique.length?'✋ '+handCount+' Hände erkannt · Marker wird 3 Sekunden gehalten …':'✋ '+handCount+' Hände erkannt · Zeige mit dem Finger auf einen Marker';
  status.textContent='✋ '+handCount+' Hand'+(handCount===1?'':'ände')+' erkannt · 🔵 '+markers.length+' Marker';
 }else if(markers.length){
  status.textContent='🔵 '+markers.length+' Marker erkannt · ☝️ keine Hand im Bild';
 }
}
function toScreenLandmark(p){return videoToScreen(p.x*video.videoWidth,p.y*video.videoHeight)}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}

// MediaPipe möglichst häufig, aber nicht in jedem Animationsframe aufrufen.
setInterval(async()=>{
 if(running&&handsReady&&video.readyState>=2&&!video.paused&&!handsBusy){
  handsBusy=true;
  try{await hands.send({image:video});}
  catch(e){status.textContent='Handerkennung: '+(e.message||e);}
  finally{handsBusy=false;}
 }
},75);

addEventListener('resize',renderMarkers);
addEventListener('beforeunload',()=>stream?.getTracks().forEach(t=>t.stop()));
</script>
</body>
</html>
