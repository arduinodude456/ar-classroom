<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AR-Baukasten</title>

<!-- Blockly (visuelle Programmierung) -->
<script src="https://unpkg.com/blockly/blockly_compressed.js"></script>
<script src="https://unpkg.com/blockly/blocks_compressed.js"></script>
<script src="https://unpkg.com/blockly/javascript_compressed.js"></script>
<script src="https://unpkg.com/blockly/msg/de.js"></script>

<!-- Three.js (3D-Bühne) -->
<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>

<!-- MediaPipe Tasks Vision (Hand-/Körpererkennung) -->
<script type="module">
  import { HandLandmarker, PoseLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";
  window.__mp = { HandLandmarker, PoseLandmarker, FilesetResolver };
  window.dispatchEvent(new Event("mp-ready"));
</script>

<style>
  :root{
    --bg: #0d1117;
    --panel: #12171f;
    --panel-2: #171d27;
    --line: #232b38;
    --text: #dfe6ee;
    --muted: #7f8ba1;
    --accent: #35c2c1;
    --accent-2: #ff9f5a;
    --danger: #e5555a;
    --ok: #58c26a;
    --radius: 6px;
    font-family: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; height:100%; background:var(--bg); color:var(--text); overflow:hidden; }

  #app { display:grid; grid-template-columns: 280px 1fr 380px; grid-template-rows: 48px 1fr; height:100vh; }

  header {
    grid-column: 1 / 4;
    display:flex; align-items:center; gap:14px;
    padding: 0 16px;
    background: linear-gradient(180deg, #141a23, #10151d);
    border-bottom: 1px solid var(--line);
  }
  header .logo { font-weight:600; letter-spacing:0.2px; font-size:15px; color:var(--text); }
  header .logo span { color: var(--accent); }
  header .status { font-size:12px; color:var(--muted); margin-left:4px; }
  header .btns { margin-left:auto; display:flex; gap:8px; }
  button.ctrl {
    background: var(--panel-2); border:1px solid var(--line); color: var(--text);
    padding:7px 14px; border-radius: var(--radius); cursor:pointer; font-size:13px;
    display:flex; align-items:center; gap:6px; transition: border-color .15s;
  }
  button.ctrl:hover { border-color: var(--accent); }
  button.run { background: #163a34; border-color:#1f5f52; color:#a6f0e4; }
  button.run:hover { border-color: var(--ok); }
  button.stop { background: #3a1c1c; border-color:#5f2323; color:#f0b3b3; }
  button.stop:hover { border-color: var(--danger); }

  #palette {
    grid-row: 2; background: var(--panel); border-right:1px solid var(--line);
    overflow-y:auto; padding: 10px 0;
  }
  #palette h3 {
    font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted);
    margin: 14px 14px 6px; font-weight:600;
  }
  #blocklyDiv { grid-row: 2; position:relative; background: var(--panel-2); }

  #stage-col { grid-row: 2; display:flex; flex-direction:column; border-left:1px solid var(--line); background:#000; }
  #stage-center { flex:1; display:flex; align-items:center; justify-content:center; overflow:hidden; padding:10px; min-height:0; }
  #stage-wrap { position:relative; overflow:hidden; background:#000; width:100%; aspect-ratio: 4 / 3; max-height:100%; border-radius:4px; box-shadow:0 0 0 1px var(--line); }
  #stage-wrap video { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; transform:scaleX(-1); opacity:0; z-index:1; }
  #stage-wrap canvas.three { position:absolute; inset:0; width:100%; height:100%; z-index:2; }
  #hud {
    position:absolute; left:10px; top:10px; font-size:11px; color:#9fe8e5;
    background:rgba(10,16,20,.55); padding:6px 9px; border-radius:5px; line-height:1.5;
    pointer-events:none; border:1px solid rgba(53,194,193,.25); z-index:3;
  }
  #camPrompt {
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:12px; background:#0a0e13; color:var(--muted); text-align:center; padding: 24px;
    z-index:10;
  }
  #camPrompt button { background:var(--accent); border:none; color:#00201f; font-weight:600; padding:10px 20px; border-radius:6px; cursor:pointer; }
  #log {
    height:130px; border-top:1px solid var(--line); background:#0a0e13; color:#98a6b8;
    font-family: "SFMono-Regular", Consolas, monospace; font-size:11.5px; padding:8px 10px;
    overflow-y:auto; white-space:pre-wrap;
  }
  #log .err { color:#ff8a8a; }
  #log .ok { color:#7ee0a0; }

  ::-webkit-scrollbar { width:9px; height:9px; }
  ::-webkit-scrollbar-thumb { background:#26303e; border-radius:5px; }
  ::-webkit-scrollbar-track { background:transparent; }
</style>
</head>
<body>

<div id="app">
  <header>
    <div class="logo">AR<span>‑</span>Baukasten</div>
    <div class="status" id="statusText">Kamera wird vorbereitet …</div>
    <div class="btns">
      <button class="ctrl run" id="btnRun">▶ Start</button>
      <button class="ctrl stop" id="btnStop">■ Stopp</button>
      <button class="ctrl" id="btnSave">Speichern</button>
      <button class="ctrl" id="btnLoad">Laden</button>
      <input type="file" id="fileLoad" accept="application/json" style="display:none">
    </div>
  </header>

  <div id="palette"></div>
  <div id="blocklyDiv"></div>

  <div id="stage-col">
    <div id="stage-center">
      <div id="stage-wrap">
        <video id="cam" autoplay playsinline muted></video>
        <div id="hud">Hände: – &nbsp;|&nbsp; Person: –</div>
        <div id="camPrompt">
          <div style="font-size:14px; max-width:280px;">Für Handverfolgung, Körpererkennung und die Live‑Kamera im Hintergrund wird Kamerazugriff benötigt.</div>
          <button id="btnCam">Kamera aktivieren</button>
        </div>
      </div>
    </div>
    <div id="log">Bereit. Baue dein Programm links im Editor und drücke „Start“.</div>
  </div>
</div>

<script>
"use strict";

/* ======================================================================
   LOGGING
====================================================================== */
const logEl = document.getElementById('log');
function log(msg, cls){
  const line = document.createElement('div');
  if (cls) line.className = cls;
  line.textContent = '› ' + msg;
  logEl.appendChild(line);
  logEl.scrollTop = logEl.scrollHeight;
}

/* ======================================================================
   THREE.JS BÜHNE  (Live-Kamerabild + 3D-Objekte)
====================================================================== */
const stageWrap = document.getElementById('stage-wrap');
const videoEl = document.getElementById('cam');

const renderer = new THREE.WebGLRenderer({ antialias:false, alpha:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio,1));
renderer.domElement.classList.add('three');
stageWrap.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera3d = new THREE.PerspectiveCamera(50, 1, 0.1, 100);
camera3d.position.set(0,0,10);
camera3d.lookAt(0,0,0);

scene.add(new THREE.HemisphereLight(0xffffff, 0x222233, 1.1));
const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
dirLight.position.set(2,4,6);
scene.add(dirLight);

// Video-Textur als Bühnenhintergrund (Ebene bei z=0)
const videoTex = new THREE.VideoTexture(videoEl);
videoTex.minFilter = THREE.LinearFilter;
videoTex.magFilter = THREE.LinearFilter;
const videoMat = new THREE.MeshBasicMaterial({ map: videoTex, depthWrite:false });
const videoGeo = new THREE.PlaneGeometry(1,1);
const videoPlane = new THREE.Mesh(videoGeo, videoMat);
videoPlane.position.z = 0;
videoPlane.renderOrder = -10;
videoPlane.visible = false;
scene.add(videoPlane);

// Ebenen-Maße (Weltkoordinaten) bei z=0, abgeleitet aus der Kamera-FOV -> für Koordinaten-Mapping
let planeW = 8, planeH = 4.5;
function updatePlaneSize(){
  const dist = camera3d.position.z; // Ebene liegt bei z=0
  const vFov = camera3d.fov * Math.PI/180;
  planeH = 2 * Math.tan(vFov/2) * dist;
  planeW = planeH * camera3d.aspect;
  videoPlane.scale.set(planeW, planeH, 1);
}

function resize(){
  const w = stageWrap.clientWidth, h = stageWrap.clientHeight;
  renderer.setSize(w,h,false);
  camera3d.aspect = w/h;
  camera3d.updateProjectionMatrix();
  updatePlaneSize();
}
new ResizeObserver(resize).observe(stageWrap);
resize();

/* Objekt-Registry für die Bausteine */
const objects = new Map(); // name -> {mesh, type, textCanvas?, ctx?}

function makeTextSprite(text, color){
  const cnv = document.createElement('canvas');
  cnv.width = 512; cnv.height = 128;
  const ctx = cnv.getContext('2d');
  const draw = (t) => {
    ctx.clearRect(0,0,cnv.width,cnv.height);
    ctx.font = '700 64px "Segoe UI", sans-serif';
    ctx.fillStyle = color || '#ffffff';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(t, cnv.width/2, cnv.height/2);
  };
  draw(text);
  const tex = new THREE.CanvasTexture(cnv);
  const mat = new THREE.SpriteMaterial({ map: tex, transparent:true });
  const sprite = new THREE.Sprite(mat);
  sprite.scale.set(2.4, 0.6, 1);
  return { sprite, ctx, cnv, tex, draw };
}

function placeObject(type, name, x,y,z, size, color, w, h){
  removeObject(name);
  let entry;
  color = color || '#35c2c1';
  if (type === 'cube'){
    const geo = new THREE.BoxGeometry(size,size,size);
    const mat = new THREE.MeshStandardMaterial({ color, metalness:.15, roughness:.5 });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(x,y,z);
    scene.add(mesh);
    entry = { mesh, type };
  } else if (type === 'sphere'){
    const geo = new THREE.SphereGeometry(size*0.6, 24, 16);
    const mat = new THREE.MeshStandardMaterial({ color, metalness:.15, roughness:.4 });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(x,y,z);
    scene.add(mesh);
    entry = { mesh, type };
  } else if (type === 'ellipse'){
    const ew = w || size, eh = h || (size*0.6);
    const geo = new THREE.CircleGeometry(0.5, 40);
    const mat = new THREE.MeshStandardMaterial({ color, metalness:.1, roughness:.6, side: THREE.DoubleSide });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(x,y,z);
    mesh.scale.set(ew, eh, 1);
    scene.add(mesh);
    entry = { mesh, type };
  } else { // text
    const t = makeTextSprite(String(name), color);
    t.sprite.position.set(x,y,z);
    t.sprite.scale.multiplyScalar(size);
    scene.add(t.sprite);
    entry = { mesh: t.sprite, type, textHelper: t };
  }
  objects.set(name, entry);
}
function moveObject(name,x,y,z){ const o=objects.get(name); if(o) o.mesh.position.set(x,y,z); }
function removeObject(name){
  const o = objects.get(name);
  if (o){ scene.remove(o.mesh); objects.delete(name); }
}
function setObjectText(name, text){
  const o = objects.get(name);
  if (o && o.textHelper){ o.textHelper.draw(String(text)); o.textHelper.tex.needsUpdate = true; }
}
function getObjectPos(name, axis){
  const o = objects.get(name);
  if (!o) return 0;
  return o.mesh.position[axis] ?? 0;
}

/* ======================================================================
   KAMERA + MEDIAPIPE (Hände & Körperhaltung)
====================================================================== */
let handLandmarker = null, poseLandmarker = null;
let handLandmarkerLoading = null, poseLandmarkerLoading = null;
let lastHands = [];   // [{handedness:'Left'|'Right', landmarks:[{x,y,z}...]}]
let lastPose = null;  // {landmarks:[{x,y,z,visibility}...]} | null
let mirrored = false; // true nur bei Frontkamera (Selfie-Ansicht)
const DETECT_INTERVAL_MS = 120; // ~8 Hz Erkennung -> deutlich weniger Rechenlast
let lastDetectTime = 0;
let detectRunning = false;
let needHands = false, needPose = false;
let fileset = null;

async function getFileset(){
  if (fileset) return fileset;
  const { FilesetResolver } = window.__mp;
  fileset = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  return fileset;
}
async function ensureHandLandmarker(){
  if (handLandmarker) return handLandmarker;
  if (handLandmarkerLoading) return handLandmarkerLoading;
  handLandmarkerLoading = (async () => {
    await new Promise(res => { if (window.__mp) res(); else window.addEventListener('mp-ready', res, {once:true}); });
    const { HandLandmarker } = window.__mp;
    const fs = await getFileset();
    log('Lade Hand-Erkennungsmodell …');
    handLandmarker = await HandLandmarker.createFromOptions(fs, {
      baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task" },
      runningMode: "VIDEO", numHands: 2
    });
    return handLandmarker;
  })();
  return handLandmarkerLoading;
}
async function ensurePoseLandmarker(){
  if (poseLandmarker) return poseLandmarker;
  if (poseLandmarkerLoading) return poseLandmarkerLoading;
  poseLandmarkerLoading = (async () => {
    await new Promise(res => { if (window.__mp) res(); else window.addEventListener('mp-ready', res, {once:true}); });
    const { PoseLandmarker } = window.__mp;
    const fs = await getFileset();
    log('Lade Körper-Erkennungsmodell …');
    poseLandmarker = await PoseLandmarker.createFromOptions(fs, {
      baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task" },
      runningMode: "VIDEO", numPoses: 1
    });
    return poseLandmarker;
  })();
  return poseLandmarkerLoading;
}
const statusText = document.getElementById('statusText');
const hud = document.getElementById('hud');

async function startCamera(){
  try{
    const constraintsList = [
      { video: { facingMode: { exact: 'environment' }, width:{ideal:640}, height:{ideal:480} }, audio:false },
      { video: { facingMode: 'environment', width:{ideal:640}, height:{ideal:480} }, audio:false },
      { video: { width:{ideal:640}, height:{ideal:480} }, audio:false }
    ];
    let stream = null, lastErr = null;
    for (const c of constraintsList){
      try { stream = await navigator.mediaDevices.getUserMedia(c); break; }
      catch(e){ lastErr = e; }
    }
    if (!stream) throw lastErr || new Error('Keine Kamera gefunden');
    videoEl.srcObject = stream;
    await videoEl.play();

    const settings = stream.getVideoTracks()[0].getSettings();
    mirrored = settings.facingMode === 'user' || !settings.facingMode;
    if (mirrored){ videoTex.wrapS = THREE.RepeatWrapping; videoTex.repeat.x = -1; videoTex.offset.x = 1; }
    else { videoTex.repeat.x = 1; videoTex.offset.x = 0; }

    document.getElementById('camPrompt').style.display = 'none';
    videoPlane.visible = true;
    statusText.textContent = 'Kamera aktiv · bereit';
    requestAnimationFrame(renderLoop);
  } catch(e){
    statusText.textContent = 'Kamera-Zugriff verweigert';
    log('Kamerafehler: ' + e.message, 'err');
    document.getElementById('camPrompt').innerHTML =
      '<div style="max-width:280px">Kamerazugriff wurde verweigert oder ist nicht verfügbar. Bitte Berechtigung erteilen und neu laden.</div>';
  }
}
document.getElementById('btnCam').addEventListener('click', startCamera);

function detectLoop(){
  if (!detectRunning) return;
  const now = performance.now();
  if (videoEl.readyState >= 2 && (now - lastDetectTime) >= DETECT_INTERVAL_MS){
    lastDetectTime = now;
    if (needHands && handLandmarker){
      const hres = handLandmarker.detectForVideo(videoEl, now);
      lastHands = (hres.landmarks||[]).map((lm,i)=>({
        handedness: (hres.handedness && hres.handedness[i] && hres.handedness[i][0]) ? hres.handedness[i][0].categoryName : 'Unknown',
        landmarks: lm
      }));
    }
    if (needPose && poseLandmarker){
      const pres = poseLandmarker.detectForVideo(videoEl, now);
      lastPose = (pres.landmarks && pres.landmarks[0]) ? { landmarks: pres.landmarks[0] } : null;
    }
    const handTxt = lastHands.length ? lastHands.map(h=>mapSide(h.handedness)).join(', ') : '–';
    hud.textContent = `Hände: ${handTxt}  |  Person: ${lastPose ? 'erkannt' : '–'}`;
  }
  requestAnimationFrame(detectLoop);
}
function mapSide(h){
  // Bei gespiegelter Frontkamera ist die erkannte Handedness zur Nutzerperspektive vertauscht
  if (mirrored){
    if (h === 'Left') return 'Rechts';
    if (h === 'Right') return 'Links';
  }
  return h === 'Left' ? 'Links' : h === 'Right' ? 'Rechts' : h;
}
function renderLoop(){
  renderer.render(scene, camera3d);
  requestAnimationFrame(renderLoop);
}

/* Koordinaten-Mapping: normalisierte Landmark-Koordinaten -> Bühnen-Weltkoordinaten */
function mapLandmarkToWorld(lm){
  // lm.x,lm.y in [0,1] (Bild), lm.z relative Tiefe (negativ = näher zur Kamera)
  // Nur bei gespiegelter Anzeige (Frontkamera) x spiegeln, damit "Rechts im Bild" = "Rechte Hand des Nutzers"
  const x = (mirrored ? (0.5 - lm.x) : (lm.x - 0.5)) * planeW;
  const y = (0.5 - lm.y) * planeH;
  const z = -lm.z * planeW * 1.5;
  return {x,y,z};
}

function findHand(side){
  // side: 'left' | 'right' | 'any' (aus Nutzersicht)
  if (side === 'any') return lastHands[0] || null;
  const wanted = mirrored
    ? (side === 'left' ? 'Right' : 'Left')   // Frontkamera: Handedness ist vertauscht
    : (side === 'left' ? 'Left' : 'Right');  // Rückkamera: direkt
  return lastHands.find(h => h.handedness === wanted) || null;
}

const FINGERTIPS = [4,8,12,16,20];
const FINGER_PIPS = [3,6,10,14,18];
const PALM_IDX = [0,5,9,13,17];

function isFist(landmarks){
  let curled = 0;
  for (let i=1;i<5;i++){ // Zeige-, Mittel-, Ring-, kleiner Finger (Daumen ausgenommen)
    const tip = landmarks[FINGERTIPS[i]], pip = landmarks[FINGER_PIPS[i]], wrist = landmarks[0];
    const dTip = Math.hypot(tip.x-wrist.x, tip.y-wrist.y);
    const dPip = Math.hypot(pip.x-wrist.x, pip.y-wrist.y);
    if (dTip < dPip) curled++;
  }
  return curled >= 3;
}
function palmCenter(landmarks){
  let x=0,y=0,z=0;
  PALM_IDX.forEach(i=>{ x+=landmarks[i].x; y+=landmarks[i].y; z+=landmarks[i].z; });
  const n = PALM_IDX.length;
  return { x:x/n, y:y/n, z:z/n };
}

function cubeTouchedByHand(x1,y1,z1,x2,y2,z2, sideKey, part){
  const minX=Math.min(x1,x2), maxX=Math.max(x1,x2);
  const minY=Math.min(y1,y2), maxY=Math.max(y1,y2);
  const minZ=Math.min(z1,z2), maxZ=Math.max(z1,z2);
  const hands = sideKey === 'any' ? lastHands : (findHand(sideKey) ? [findHand(sideKey)] : []);
  for (const h of hands){
    const lm = h.landmarks;
    if (part === 'fist'){
      if (!isFist(lm)) continue;
      const p = mapLandmarkToWorld(palmCenter(lm));
      if (p.x>=minX&&p.x<=maxX&&p.y>=minY&&p.y<=maxY&&p.z>=minZ&&p.z<=maxZ) return true;
    } else if (part === 'palm'){
      const p = mapLandmarkToWorld(palmCenter(lm));
      if (p.x>=minX&&p.x<=maxX&&p.y>=minY&&p.y<=maxY&&p.z>=minZ&&p.z<=maxZ) return true;
    } else { // finger tips
      for (const idx of FINGERTIPS){
        const p = mapLandmarkToWorld(lm[idx]);
        if (p.x>=minX&&p.x<=maxX&&p.y>=minY&&p.y<=maxY&&p.z>=minZ&&p.z<=maxZ) return true;
      }
    }
  }
  return false;
}

const POSE_LANDMARKS = {
  nase: 0, linke_schulter: 11, rechte_schulter: 12, linker_ellbogen: 13, rechter_ellbogen: 14,
  linkes_handgelenk: 15, rechtes_handgelenk: 16, linke_hüfte: 23, rechte_hüfte: 24,
  linkes_knie: 25, rechtes_knie: 26, linker_knöchel: 27, rechter_knöchel: 28
};
function bodyPos(landmarkKey, axis){
  if (!lastPose) return 0;
  const idx = POSE_LANDMARKS[landmarkKey];
  if (idx === undefined) return 0;
  const lm = lastPose.landmarks[idx];
  if (!lm) return 0;
  const w = mapLandmarkToWorld(lm);
  return w[axis];
}

/* ======================================================================
   RUNTIME – Ausführungsschnittstelle für generierten Blockcode
====================================================================== */
const Runtime = {
  placeObject, moveObject, removeObject, setObjectText, getObjectPos,
  handVisible(sideKey){
    if (sideKey === 'any') return lastHands.length > 0;
    return !!findHand(sideKey);
  },
  handPos(sideKey, axis){
    const h = findHand(sideKey);
    if (!h) return 0;
    const w = mapLandmarkToWorld(palmCenter(h.landmarks));
    return w[axis];
  },
  cubeTouchedByHand,
  personVisible(){ return !!lastPose; },
  bodyPos,
  *wait(seconds){
    const end = performance.now() + seconds*1000;
    while (performance.now() < end) yield;
  }
};

/* ======================================================================
   BLOCKLY – Eigene Blöcke für AR / Hände / Körper
====================================================================== */
const COL = { event:'#c26b2b', control:'#e0a83c', hand:'#35a3c2', body:'#8a5fd6', obj:'#3fae66', var:'#c25b8f' };

Blockly.defineBlocksWithJsonArray([
  // --- EVENTS ---
  {
    "type": "event_whenflag",
    "message0": "wenn ▶ Start gedrückt",
    "nextStatement": null,
    "colour": COL.event,
    "tooltip": "Startpunkt eines Programms."
  },
  // --- CONTROL: forever ---
  {
    "type": "control_forever",
    "message0": "wiederhole fortlaufend %1 %2",
    "args0": [ {"type":"input_dummy"}, {"type":"input_statement","name":"DO"} ],
    "previousStatement": null, "nextStatement": null,
    "colour": COL.control,
    "tooltip": "Führt die enthaltenen Blöcke jeden Frame erneut aus (läuft nicht blockierend)."
  },
  {
    "type": "control_wait",
    "message0": "warte %1 Sekunden",
    "args0": [ {"type":"input_value","name":"SEC","check":"Number"} ],
    "previousStatement": null, "nextStatement": null,
    "colour": COL.control,
    "inputsInline": true
  },
  // --- HAND DETECTION ---
  {
    "type": "hand_visible",
    "message0": "Hand [%1] sichtbar?",
    "args0": [ {"type":"field_dropdown","name":"SIDE","options":[["links","left"],["rechts","right"],["egal","any"]]} ],
    "output":"Boolean", "colour": COL.hand

/* --- JavaScript-Generatoren für die eigenen Blöcke --- */
const JS = Blockly.JavaScript;

JS.forBlock['event_whenflag'] = function(block){ return ''; };

JS.forBlock['control_forever'] = function(block){
  const body = JS.statementToCode(block, 'DO');
  return 'while (true) {\n' + body + '  yield;\n}\n';
};
JS.forBlock['control_wait'] = function(block){
  const sec = JS.valueToCode(block, 'SEC', JS.ORDER_NONE) || '1';
  return 'yield* Runtime.wait(' + sec + ');\n';
};

JS.forBlock['hand_visible'] = function(block){
  const side = block.getFieldValue('SIDE');
  return ['Runtime.handVisible(' + JSON.stringify(side) + ')', JS.ORDER_FUNCTION_CALL];
};
JS.forBlock['hand_position'] = function(block){
  const axis = block.getFieldValue('AXIS'), side = block.getFieldValue('SIDE');
  return ['Runtime.handPos(' + JSON.stringify(side) + ',' + JSON.stringify(axis) + ')', JS.ORDER_FUNCTION_CALL];
};
JS.forBlock['cube_touched_by_hand'] = function(block){
  const g = n => JS.valueToCode(block, n, JS.ORDER_NONE) || '0';
  const side = block.getFieldValue('SIDE'), part = block.getFieldValue('PART');
  const args = [g('X1'),g('Y1'),g('Z1'),g('X2'),g('Y2'),g('Z2'), JSON.stringify(side), JSON.stringify(part)].join(',');
  return ['Runtime.cubeTouchedByHand(' + args + ')', JS.ORDER_FUNCTION_CALL];
};

JS.forBlock['person_visible'] = function(){ return ['Runtime.personVisible()', JS.ORDER_FUNCTION_CALL]; };
JS.forBlock['body_position'] = function(block){
  const axis = block.getFieldValue('AXIS'), part = block.getFieldValue('PART');
  return ['Runtime.bodyPos(' + JSON.stringify(part) + ',' + JSON.stringify(axis) + ')', JS.ORDER_FUNCTION_CALL];
};

JS.forBlock['place_object'] = function(block){
  const type = block.getFieldValue('TYPE'), name = block.getFieldValue('NAME'), color = block.getFieldValue('COLOR');
  const g = n => JS.valueToCode(block, n, JS.ORDER_NONE) || '0';
  return `Runtime.placeObject(${JSON.stringify(type)},${JSON.stringify(name)},${g('X')},${g('Y')},${g('Z')},${g('SIZE')||1},${JSON.stringify(color)});\n`;
};
JS.forBlock['place_ellipse'] = function(block){
  const name = block.getFieldValue('NAME'), color = block.getFieldValue('COLOR');
  const g = n => JS.valueToCode(block, n, JS.ORDER_NONE) || '0';
  return `Runtime.placeObject("ellipse",${JSON.stringify(name)},${g('X')},${g('Y')},${g('Z')},1,${JSON.stringify(color)},${g('W')||1},${g('H')||1});\n`;
};
JS.forBlock['move_object'] = function(block){
  const name = block.getFieldValue('NAME');
  const g = n => JS.valueToCode(block, n, JS.ORDER_NONE) || '0';
  return `Runtime.moveObject(${JSON.stringify(name)},${g('X')},${g('Y')},${g('Z')});\n`;
};
JS.forBlock['remove_object'] = function(block){
  return `Runtime.removeObject(${JSON.stringify(block.getFieldValue('NAME'))});\n`;
};
JS.forBlock['set_object_text'] = function(block){
  const name = block.getFieldValue('NAME');
  const txt = JS.valueToCode(block, 'TEXT', JS.ORDER_NONE) || '""';
  return `Runtime.setObjectText(${JSON.stringify(name)},${txt});\n`;
};
JS.forBlock['get_object_pos'] = function(block){
  const axis = block.getFieldValue('AXIS'), name = block.getFieldValue('NAME');
  return ['Runtime.getObjectPos(' + JSON.stringify(name) + ',' + JSON.stringify(axis) + ')', JS.ORDER_FUNCTION_CALL];
};

/* ======================================================================
   AUSFÜHRUNG – Generator-basierter Scheduler (kein Main-Thread-Block)
====================================================================== */
let runningGenerators = [];
let rafId = null;

async function compileAndRun(){
  stopProgram();
  let hadErrorBlock = false;
  try{ Blockly.JavaScript.init(workspace); }catch(e){}
  const tops = workspace.getTopBlocks(true).filter(b => b.type === 'event_whenflag');
  if (!tops.length){ log('Kein „wenn ▶ Start gedrückt“-Block gefunden.', 'err'); return; }

  const compiled = [];
  tops.forEach((hat, i) => {
    let code = '';
    try{
      code = JS.blockToCode(hat);
      if (Array.isArray(code)) code = code[0];
    }catch(e){
      log('Fehler beim Kompilieren von Skript ' + (i+1) + ': ' + e.message, 'err');
      hadErrorBlock = true; return;
    }
    compiled.push({ code, idx:i+1 });
  });
  if (!compiled.length) return;

  const fullCode = compiled.map(c=>c.code).join('\n');
  needHands = /Runtime\.(handVisible|handPos|cubeTouchedByHand)/.test(fullCode);
  needPose  = /Runtime\.(personVisible|bodyPos)/.test(fullCode);

  if (needHands || needPose){
    statusText.textContent = 'Lade Erkennungsmodelle …';
    try{
      if (needHands) await ensureHandLandmarker();
      if (needPose) await ensurePoseLandmarker();
    }catch(e){
      log('Konnte Erkennungsmodell nicht laden: ' + e.message, 'err');
    }
    statusText.textContent = 'Kamera aktiv · bereit';
    detectRunning = true;
    lastDetectTime = 0;
    requestAnimationFrame(detectLoop);
  } else {
    hud.textContent = 'Hände: – (ungenutzt)  |  Person: – (ungenutzt)';
  }

  runningGenerators = [];
  compiled.forEach(({code, idx}) => {
    try{
      const factory = new Function('Runtime', 'return function*(){\n' + code + '\n}')(Runtime);
      runningGenerators.push({ gen: factory(), idx });
    }catch(e){
      log('Syntaxfehler in Skript ' + idx + ': ' + e.message, 'err');
      hadErrorBlock = true;
    }
  });
  if (!hadErrorBlock) log('Programm gestartet (' + runningGenerators.length + ' Skript(e)).', 'ok');
  if (runningGenerators.length) tick();
}

function tick(){
  runningGenerators = runningGenerators.filter(entry => {
    try{
      const r = entry.gen.next();
      return !r.done;
    }catch(e){
      log('Laufzeitfehler in Skript ' + entry.idx + ': ' + e.message, 'err');
      return false;
    }
  });
  if (runningGenerators.length) rafId = requestAnimationFrame(tick);
}

function stopProgram(){
  runningGenerators = [];
  detectRunning = false;
  if (rafId) cancelAnimationFrame(rafId);
  rafId = null;
}

document.getElementById('btnRun').addEventListener('click', compileAndRun);
document.getElementById('btnStop').addEventListener('click', () => { stopProgram(); log('Programm gestoppt.'); });

====================================================================== */
document.getElementById('btnSave').addEventListener('click', () => {
  const state = Blockly.serialization.workspaces.save(workspace);
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'ar-baukasten-programm.json';
  a.click();
});
document.getElementById('btnLoad').addEventListener('click', () => document.getElementById('fileLoad').click());
document.getElementById('fileLoad').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const state = JSON.parse(reader.result);
      workspace.clear();
      Blockly.serialization.workspaces.load(state, workspace);
      log('Programm geladen: ' + file.name, 'ok');
    }catch(err){ log('Konnte Datei nicht laden: ' + err.message, 'err'); }
  };
  reader.readAsText(file);
});
