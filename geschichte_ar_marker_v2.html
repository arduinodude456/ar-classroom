<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Geschichte erleben – AR Marker Test</title>
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://raw.githack.com/AR-js-org/AR.js/3.4.8/aframe/build/aframe-ar.js"></script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:system-ui,sans-serif}
#start{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;background:#111}
.card{max-width:420px;margin:20px;padding:26px;border-radius:22px;background:#fff;color:#111;text-align:center;box-shadow:0 12px 40px #0008}
button{padding:15px 22px;border:0;border-radius:14px;background:#222;color:#fff;font-size:18px;font-weight:700}
#status{margin-top:12px;color:#555;font-size:14px}
#info{position:fixed;left:14px;right:14px;bottom:14px;z-index:9999;padding:16px;border-radius:16px;background:#111d;color:#fff;backdrop-filter:blur(8px);display:none}
</style>
</head>
<body style="margin:0;overflow:hidden">
<div id="start"><div class="card">
<h1>🏛️ Geschichte erleben</h1>
<p>Minimaler AR-Test mit <b>AR.js Marker Tracking</b>.</p>
<p>Tippe auf Start und erlaube die Kamera. Danach halte den <b>Hiro-Marker</b> vor die Kamera.</p>
<button id="go">Kamera & AR starten</button>
<div id="status">Bereit</div>
</div></div>

<div id="info"><b>🏛️ ANTIKES OBJEKT</b><br>Der Marker wurde erkannt. Die AR-Basis funktioniert.</div>

<a-scene
  embedded
  vr-mode-ui="enabled:false"
  renderer="antialias:true; alpha:true; precision:medium"
  arjs="trackingMethod:best; sourceType:webcam; videoTexture:true; debugUIEnabled:false;">
  <a-marker preset="hiro" id="marker" emitevents="true">
    <a-cylinder position="0 0.12 0" radius="0.28" height="0.18" color="#777"></a-cylinder>
    <a-cylinder position="0 0.52 0" radius="0.11" height="0.65" color="#d9c7a0"></a-cylinder>
    <a-box position="0 0.87 0" width="0.34" height="0.12" depth="0.34" color="#d9c7a0"></a-box>
    <a-plane position="0 1.05 0" rotation="-90 0 0" width="0.9" height="0.42" color="#202b38">
      <a-text value="ANTIKE" align="center" color="#fff" width="2.5" position="0 0 0.01"></a-text>
    </a-plane>
  </a-marker>
  <a-entity camera></a-entity>
</a-scene>

<script>
const start=document.getElementById('start');
const go=document.getElementById('go');
const status=document.getElementById('status');
const info=document.getElementById('info');
const marker=document.getElementById('marker');
let started=false;

go.addEventListener('click',()=>{
  started=true;
  start.style.display='none';
  status.textContent='Kamera wird gestartet …';
  setTimeout(()=>status.textContent='Kamera aktiv – Hiro-Marker suchen …',1500);
});
marker.addEventListener('markerFound',()=>{ if(started) info.style.display='block'; });
marker.addEventListener('markerLost',()=>{ info.style.display='none'; });
window.addEventListener('camera-init',()=>{ if(started) status.textContent='Kamera aktiv – Hiro-Marker suchen …'; });
window.addEventListener('camera-error',(e)=>{
  start.style.display='flex';
  status.textContent='Kamerafehler: '+(e.detail?.error||'Kamera konnte nicht gestartet werden');
});
</script>
</body>
</html>
